name: swe_step_agent
description: One agent that fixes the issue by making one bounded decision per step of the deterministic swe/step.py procedure.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include prompts/swe.md
tools:
  # Since swegemma 0.2.11 the task message advertises only the declared tools, and a call to an undeclared tool is
  # answered with an error instead of ending the task, so the code-graph tools (never needed) are not declared.
  - submit_patch
skills: [skills/swe]
generate_content_config: !include configs/sampling.yaml
